<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STRIKE · Football Turf, Khulna</title>
<meta name="description" content="STRIKE — floodlit football turf at JoyBangla Mor, Khulna. Walk in, pick your 90 minutes, take your shot.">
<meta name="theme-color" content="#050806">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23050806'/%3E%3Ctext x='32' y='46' font-family='Impact,sans-serif' font-size='40' text-anchor='middle' fill='%23d4ff3a'%3ES%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800;900&family=Hind+Siliguri:wght@400;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
:root{
  --ink:#050806; --ink2:#0b120d; --glass:rgba(7,12,9,.74); --line:rgba(243,241,232,.12); --line2:rgba(243,241,232,.22);
  --chalk:#f3f1e8; --mute:rgba(243,241,232,.66); --dim:rgba(243,241,232,.42);
  --lime:#d4ff3a; --flare:#ff5a1f; --kit:#d4ff3a;
  --display:"Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
  --sans:"Instrument Sans", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --bn:"Hind Siliguri", sans-serif;
  --ease:cubic-bezier(.77,0,.18,1); --out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --top:68px; --tick:38px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ink);color:var(--chalk);font-family:var(--sans);font-size:15px;line-height:1.5;overflow:hidden;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
::selection{background:var(--lime);color:var(--ink)}
:focus-visible{outline:2px solid var(--lime);outline-offset:3px}
.mono{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.bn{font-family:var(--bn);font-weight:600}
svg{display:block}

/* ---------- scene ---------- */
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:pan-y}
body.no-gl #scene{display:none}
body.no-gl{background:radial-gradient(80% 60% at 70% 40%,#123d22,transparent 60%),radial-gradient(60% 50% at 20% 90%,#0d2a17,transparent),var(--ink)}
.shade{position:fixed;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 90% at 60% 45%,transparent 50%,rgba(3,5,4,.55) 100%),linear-gradient(180deg,rgba(3,5,4,.65),transparent 14%,transparent 72%,rgba(3,5,4,.75))}
body.desk-on .shade{background:radial-gradient(120% 90% at 65% 45%,transparent 45%,rgba(3,5,4,.55) 100%),linear-gradient(90deg,rgba(3,5,4,.6),transparent 38%),linear-gradient(180deg,rgba(3,5,4,.65),transparent 14%,transparent 82%,rgba(3,5,4,.7))}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}

/* ---------- boot ---------- */
.boot{position:fixed;inset:0;z-index:100;background:#020302;display:grid;place-content:center;justify-items:center;gap:16px;transition:opacity .8s var(--ease),visibility .8s}
.boot.gone{opacity:0;visibility:hidden}
.boot b{font:900 54px/1 var(--display);letter-spacing:.06em;color:#1c2416}
.boot i{width:180px;height:2px;background:var(--line);overflow:hidden;position:relative}
.boot i::after{content:"";position:absolute;inset:0;background:var(--lime);transform-origin:left;animation:bootbar 1.4s var(--ease) infinite}
@keyframes bootbar{0%{transform:scaleX(0)}60%{transform:scaleX(1)}100%{transform:scaleX(1);opacity:0}}
.boot span{color:var(--dim)}

/* ---------- top bar ---------- */
.top{position:fixed;inset:0 0 auto;height:var(--top);z-index:30;display:flex;align-items:center;gap:20px;padding:0 22px}
.logo{display:flex;align-items:center;gap:10px;font:900 30px/1 var(--display);letter-spacing:.04em;flex:0 0 auto}
.logo i{width:13px;height:13px;border-radius:50%;background:var(--lime);box-shadow:0 0 14px var(--lime)}
.logo span{transform:skewX(-9deg);display:inline-block}
.rail{position:relative;flex:1;max-width:780px;margin:0 auto;display:flex;justify-content:space-between;padding-top:4px}
.rail-track{position:absolute;left:14px;right:14px;top:13px;height:2px;background:var(--line2);border-radius:2px}
.rail-fill{position:absolute;inset:0;background:var(--kit);transform-origin:left;transform:scaleX(0);transition:transform .9s var(--out),background .4s;box-shadow:0 0 10px var(--kit)}
.rail-ball{position:absolute;top:-7px;left:0;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#d9d9d0 60%,#9a9a90);box-shadow:0 0 0 2px var(--ink),0 2px 10px rgba(0,0,0,.6);transition:left .9s var(--out)}
.rail-ball::after{content:"";position:absolute;inset:4px;background:#111;clip-path:polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%);opacity:.85}
.rn{position:relative;z-index:1;display:grid;justify-items:center;gap:3px;min-width:0;width:16.6%;padding:0 2px}
.rn .d{width:10px;height:10px;border-radius:50%;background:var(--ink);border:1.5px solid var(--line2);margin-top:8px;transition:.3s}
.rn .l{font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);transition:color .3s}
.rn .v{font:600 12px var(--sans);color:var(--chalk);max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:17px}
.rn.done .d{background:var(--kit);border-color:var(--kit)}
.rn.cur .d{border-color:var(--kit);box-shadow:0 0 0 4px rgba(212,255,58,.15)}
.rn.cur .l{color:var(--kit)}
.rn:disabled{cursor:default}
.rn:not(:disabled):hover .l{color:var(--chalk)}
.top-r{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.chip{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line2);background:rgba(5,8,6,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);white-space:nowrap}
.chip .rec{width:7px;height:7px;border-radius:50%;background:#ff3b30;box-shadow:0 0 10px #ff3b30;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.chip svg{width:16px;height:16px}
.icb{width:36px;padding:0;justify-content:center;transition:background .2s,color .2s}
.icb:hover,.icb[aria-pressed="true"]{background:var(--chalk);color:var(--ink)}
.cur-l{display:none}

/* ---------- gate ---------- */
.gate{position:fixed;left:0;right:0;bottom:var(--tick);top:var(--top);z-index:10;display:flex;flex-direction:column;justify-content:flex-end;padding:0 clamp(18px,5vw,72px) clamp(22px,5vh,56px);pointer-events:none;transition:opacity .7s var(--ease),transform .9s var(--ease)}
.gate>*{pointer-events:auto}
.gate.hidden{opacity:0;transform:translateY(30px);pointer-events:none}
.gate.hidden>*{pointer-events:none}
.g-kick{display:flex;gap:10px;align-items:center;color:var(--mute)}
.g-kick i{width:26px;height:1px;background:var(--lime)}
.neon{font:900 clamp(92px,16vw,250px)/.82 var(--display);letter-spacing:.03em;color:#f6ffe0;margin:10px 0 4px;
  text-shadow:0 0 4px #fff,0 0 16px var(--lime),0 0 38px var(--lime),0 0 90px rgba(212,255,58,.55)}
.neon span{display:inline-block;opacity:.07;animation:neonOn 1.5s steps(1) forwards;animation-delay:calc(.5s + var(--i)*.13s)}
.neon span:nth-child(5){animation:neonOn 1.5s steps(1) forwards 1.1s,buzz 9s 4s infinite}
@keyframes neonOn{0%{opacity:.07}12%{opacity:1}18%{opacity:.12}30%{opacity:1}36%{opacity:.3}46%,100%{opacity:1}}
@keyframes buzz{0%,93%,100%{opacity:1}94%{opacity:.25}96%{opacity:1}97%{opacity:.4}}
.g-bn{font-size:clamp(18px,2vw,26px);color:var(--chalk)}
.greet{max-width:560px;color:var(--mute);font-size:clamp(15px,1.3vw,18px);margin-top:12px;min-height:3.2em}
.greet::after{content:"▍";color:var(--lime);animation:blink 1s infinite;margin-left:2px}
.greet.done::after{display:none}
.g-row{display:flex;gap:16px;align-items:stretch;margin-top:24px;flex-wrap:wrap}
.now{border:1px solid var(--line2);border-radius:18px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px;display:grid;grid-template-columns:auto auto;gap:10px 26px;min-width:300px}
.now .mono{color:var(--dim);grid-column:1/-1;display:flex;align-items:center;gap:8px}
.now .mono .rec{width:7px;height:7px;border-radius:50%;background:#ff3b30;animation:blink 1.4s infinite}
.now div b{display:block;font:800 26px/1 var(--display);text-transform:uppercase}
.now div span{font-size:12px;color:var(--mute)}
.mine{border-color:var(--kit);background:linear-gradient(140deg,rgba(212,255,58,.12),var(--glass) 60%)}
.g-btns{display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:48px;padding:0 22px;border-radius:999px;font:600 15px var(--sans);white-space:nowrap;transition:transform .35s var(--spring),background .2s,color .2s,box-shadow .3s,opacity .2s}
.btn-k{background:var(--kit);color:var(--ink)}
.btn-k:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 12px 30px -10px var(--kit)}
.btn-k:disabled{opacity:.28;cursor:not-allowed}
.btn-g{border:1px solid var(--line2);background:rgba(5,8,6,.4)}
.btn-g:hover{background:var(--chalk);color:var(--ink)}
.btn-big{height:60px;font-size:17px;padding:0 30px}
.btn .arr{transition:transform .35s var(--spring)}
.btn:hover .arr{transform:translateX(4px)}
.g-links{display:flex;gap:8px}
.g-links .btn{height:40px;font-size:13px;padding:0 16px;flex:1}

/* ---------- desk ---------- */
.desk{position:fixed;z-index:20;left:20px;top:calc(var(--top) + 14px);bottom:calc(var(--tick) + 18px);width:430px;display:flex;flex-direction:column;
  background:var(--glass);backdrop-filter:blur(20px) saturate(1.2);-webkit-backdrop-filter:blur(20px) saturate(1.2);border:1px solid var(--line2);border-radius:26px;overflow:hidden;
  transition:opacity .6s var(--ease),transform .8s var(--out)}
.desk::before{content:"";position:absolute;left:24px;right:24px;top:0;height:2px;background:var(--kit);box-shadow:0 0 18px var(--kit);border-radius:2px;transition:background .4s}
.desk.hidden{opacity:0;transform:translateX(-40px);pointer-events:none}
.desk-h{display:flex;justify-content:space-between;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line);color:var(--dim)}
.desk-h b{color:var(--kit);font-weight:600}
.desk-b{flex:1;overflow-y:auto;padding:22px 22px 26px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.desk-b.in>*{animation:rise .7s var(--out) both}
.desk-b.in>*:nth-child(2){animation-delay:.05s}.desk-b.in>*:nth-child(3){animation-delay:.1s}.desk-b.in>*:nth-child(4){animation-delay:.15s}.desk-b.in>*:nth-child(n+5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.desk-f{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
.desk-f .btn{height:50px}
.desk-f #next{flex:1}
.q{font:900 clamp(40px,3.6vw,54px)/.88 var(--display);text-transform:uppercase;margin:8px 0 6px}
.q-n{color:var(--kit)}
.q-bn{color:var(--mute);font-size:17px}
.hint{color:var(--dim);font-size:13px;margin:10px 0 18px}
.hint b{color:var(--chalk);font-weight:600}

/* day */
.dates{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dt{position:relative;border:1px solid var(--line2);border-radius:14px;padding:10px 6px 8px;display:grid;justify-items:center;gap:1px;transition:transform .3s var(--spring),background .2s,border-color .2s}
.dt:hover:not(:disabled){transform:translateY(-2px);border-color:var(--chalk)}
.dt .w{font:600 10px var(--mono);letter-spacing:.1em;color:var(--mute)}
.dt b{font:800 32px/1 var(--display)}
.dt .m{font:600 9px var(--mono);letter-spacing:.12em;color:var(--dim)}
.dt .x{display:flex;align-items:center;gap:3px;font:500 10px var(--mono);color:var(--mute);margin-top:3px;min-height:14px}
.dt .x svg{width:13px;height:13px}
.dt .bar{width:70%;height:3px;border-radius:2px;background:var(--line);margin-top:4px;overflow:hidden}
.dt .bar i{display:block;height:100%;background:var(--kit)}
.dt .wk{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--flare)}
.dt.sel{background:var(--chalk);color:var(--ink);border-color:var(--chalk)}
.dt.sel .w,.dt.sel .m,.dt.sel .x{color:rgba(5,8,6,.6)}
.dt.sel .bar{background:rgba(5,8,6,.15)}.dt.sel .bar i{background:var(--ink)}
.dt:disabled{opacity:.3;cursor:not-allowed}

/* time */
.tg{margin-bottom:16px}
.tg-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:var(--mute)}
.tg-h i{width:8px;height:8px;border-radius:50%}
.tg-h span:last-child{margin-left:auto;color:var(--chalk);font-weight:600}
.tcs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tc{border:1px solid var(--line2);border-radius:12px;padding:10px 6px;display:grid;justify-items:center;gap:2px;transition:transform .3s var(--spring),background .2s,border-color .2s}
.tc b{font:800 26px/1 var(--display);font-variant-numeric:tabular-nums}
.tc span{font:600 9px var(--mono);letter-spacing:.08em;color:var(--dim);white-space:nowrap}
.tc.open:hover{transform:translateY(-2px);border-color:var(--kit)}
.tc.open span{color:var(--mute)}
.tc.taken,.tc.past,.tc.live,.tc.mine{cursor:not-allowed}
.tc.taken b,.tc.past b{opacity:.3;text-decoration:line-through;text-decoration-thickness:2px}
.tc.live{border-color:rgba(255,90,31,.5)}.tc.live span{color:var(--flare)}
.tc.mine{border-color:var(--kit)}.tc.mine span{color:var(--kit)}
.tc.sel{background:var(--kit);border-color:var(--kit);color:var(--ink)}
.tc.sel span{color:rgba(5,8,6,.7)}
.fc{display:flex;align-items:center;gap:12px;border:1px dashed var(--line2);border-radius:14px;padding:12px 14px;margin-top:4px;color:var(--mute);font-size:13px}
.fc svg{width:28px;height:28px;flex:0 0 auto;color:var(--chalk)}
.fc b{color:var(--chalk);font-weight:600}

/* squad */
.sqs{display:grid;gap:10px}
.sq{display:grid;grid-template-columns:120px 1fr;gap:16px;align-items:center;border:1px solid var(--line2);border-radius:16px;padding:12px;text-align:left;transition:transform .3s var(--spring),border-color .2s,background .2s}
.sq:hover{transform:translateX(4px);border-color:var(--chalk)}
.sq svg{width:120px;height:76px}
.sq b{font:900 44px/.9 var(--display);display:block}
.sq span{color:var(--mute);font-size:13px}
.sq.sel{border-color:var(--kit);background:linear-gradient(120deg,rgba(212,255,58,.14),transparent 70%)}
.sq.sel b{color:var(--kit)}

/* team */
.f{display:grid;gap:6px;margin-bottom:18px}
.f>label,.f>.mono{color:var(--dim)}
.f input{background:transparent;border:0;border-bottom:1.5px solid var(--line2);padding:6px 0 10px;outline:none;border-radius:0;transition:border-color .2s;width:100%}
.f input:focus{border-color:var(--kit)}
.f input::placeholder{color:rgba(243,241,232,.25)}
.f.big input{font:800 38px/1.1 var(--display);text-transform:uppercase}
.f.mid input{font-size:18px}
.f .err{color:var(--flare);font:500 11px var(--mono);min-height:14px}
.f.bad input{border-color:var(--flare)}
.dice{justify-self:start;display:inline-flex;align-items:center;gap:8px;color:var(--mute);font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;padding:6px 0}
.dice:hover{color:var(--kit)}
.dice svg{width:16px;height:16px}
.kits{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.kit{display:grid;justify-items:center;gap:6px;font:600 10px var(--mono);letter-spacing:.06em;color:var(--dim);text-transform:uppercase}
.kit i{width:44px;height:44px;border-radius:50%;background:var(--c);border:3px solid var(--ink);box-shadow:0 0 0 1.5px var(--line2);transition:transform .3s var(--spring),box-shadow .2s}
.kit:hover i{transform:scale(1.08)}
.kit.sel i{box-shadow:0 0 0 2px var(--c),0 0 22px var(--c);transform:scale(1.1)}
.kit.sel{color:var(--chalk)}

/* confirm */
.ledger{border:1px solid var(--line2);border-radius:16px;padding:6px 16px;margin:4px 0 18px;background:rgba(3,5,4,.35)}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--line);font-size:14px}
.ledger div:last-child{border-bottom:0}
.ledger span{color:var(--dim);font:600 10px var(--mono);letter-spacing:.1em;text-transform:uppercase;align-self:center}
.ledger b{font-weight:600;text-align:right}
.ledger .tot b{font:800 24px/1 var(--display)}
.ledger .adv b{color:var(--kit)}
.hold{position:relative;flex:1;height:50px;border-radius:999px;overflow:hidden;border:1.5px solid var(--kit);background:rgba(3,5,4,.5);display:grid;place-items:center;user-select:none;-webkit-user-select:none;touch-action:none;transition:transform .2s}
.hold:active{transform:scale(.98)}
.hold i{position:absolute;inset:0;background:var(--kit);transform-origin:left;transform:scaleX(var(--p,0))}
.hold span{position:relative;font:900 22px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;mix-blend-mode:difference;color:#fff}
.hold.shake{animation:shk .35s}
@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fine{color:var(--dim);font-size:12px;text-align:center;margin-top:10px}

/* ---------- ticker ---------- */
.ticker{position:fixed;left:0;right:0;bottom:0;height:var(--tick);z-index:30;background:rgba(3,5,4,.88);border-top:1px solid var(--line);display:flex;align-items:center;overflow:hidden}
.t-live{flex:0 0 auto;height:100%;display:flex;align-items:center;gap:8px;padding:0 14px;background:var(--flare);color:var(--ink);font:700 11px var(--mono);letter-spacing:.14em}
.t-live i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:blink 1s infinite}
.t-wrap{flex:1;overflow:hidden;mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent);-webkit-mask:linear-gradient(90deg,transparent,#000 4%,#000 96%,transparent)}
.t-track{display:flex;width:max-content;animation:tk 70s linear infinite}
.ticker:hover .t-track{animation-play-state:paused}
@keyframes tk{to{transform:translateX(-50%)}}
.t-track span{font:500 12px var(--mono);letter-spacing:.06em;color:var(--mute);padding:0 22px;white-space:nowrap;display:flex;align-items:center;gap:22px}
.t-track span::after{content:"◆";font-size:8px;color:var(--kit)}
.t-track b{color:var(--chalk);font-weight:600}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(2,3,2,.6);opacity:0;pointer-events:none;transition:opacity .4s}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(520px,100vw);background:var(--ink2);border-left:1px solid var(--line2);transform:translateX(100%);transition:transform .6s var(--out);display:flex;flex-direction:column}
.drawer.on{transform:none}
.dr-h{display:flex;align-items:center;gap:6px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dr-h .tab{height:36px;padding:0 14px;border-radius:999px;font:600 13px var(--sans);color:var(--mute)}
.dr-h .tab[aria-selected="true"]{background:var(--chalk);color:var(--ink)}
.dr-h .x{margin-left:auto}
.dr-b{flex:1;overflow-y:auto;padding:24px 22px 40px}
.dr-b h3{font:900 44px/.9 var(--display);text-transform:uppercase;margin-bottom:6px}
.dr-b .bn{color:var(--mute)}
.rate{display:flex;align-items:center;gap:14px;border:1px solid var(--line2);border-radius:16px;padding:16px;margin-top:10px}
.rate i{width:10px;height:44px;border-radius:6px}
.rate b{font:800 26px/1 var(--display);text-transform:uppercase;display:block}
.rate span{color:var(--mute);font-size:13px}
.rate strong{margin-left:auto;font:900 34px/1 var(--display)}
.map{position:relative;height:280px;border-radius:18px;overflow:hidden;border:1px solid var(--line2);margin:16px 0}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0;filter:invert(.92) hue-rotate(180deg) saturate(.4) brightness(.9)}
.map .pin{position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px;border-radius:50%;background:var(--lime);border:3px solid var(--ink);box-shadow:0 0 0 2px var(--lime),0 0 24px var(--lime);pointer-events:none}
.coords{font:800 34px/1 var(--display);color:var(--lime);margin:14px 0 4px}
.rules{display:grid;gap:8px;margin:14px 0 26px}
.rules div{display:flex;gap:12px;align-items:baseline;border-bottom:1px dashed var(--line);padding-bottom:8px;color:var(--mute)}
.rules div b{font:700 12px var(--mono);color:var(--lime)}
details{border-top:1px solid var(--line2)}
summary{list-style:none;cursor:pointer;padding:16px 0;font:700 20px/1.15 var(--display);text-transform:uppercase;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--lime);font-family:var(--mono)}
details[open] summary::after{content:"–"}
details p{color:var(--mute);padding-bottom:16px}
.contact{display:grid;gap:8px;margin-top:22px}

/* ---------- strike fx ---------- */
.slam{position:fixed;inset:0;z-index:55;display:grid;place-items:center;pointer-events:none}
.slam h2{font:900 clamp(110px,22vw,340px)/.8 var(--display);letter-spacing:.02em;display:flex;transform:skewX(-10deg)}
.slam h2 span{display:inline-block;color:var(--kit);-webkit-text-stroke:3px var(--ink);text-shadow:8px 8px 0 var(--ink),0 0 60px var(--kit);opacity:0}
.slam.go h2 span{animation:slam .9s var(--spring) both,slamOut .5s var(--ease) 1.5s forwards;animation-delay:calc(var(--i)*55ms),calc(1.5s + var(--i)*30ms)}
@keyframes slam{from{opacity:0;transform:translateY(-40px) scale(3) rotate(-12deg)}to{opacity:1;transform:none}}
@keyframes slamOut{to{opacity:0;transform:translateY(60px) scale(.8)}}

/* ---------- receipt ---------- */
.rc{position:fixed;inset:0;z-index:50;display:grid;justify-items:center;align-content:start;padding:calc(var(--top) + 4px) 16px calc(var(--tick) + 16px);overflow-y:auto;background:radial-gradient(80% 70% at 50% 40%,transparent,rgba(2,3,2,.55))}
.rc-in{width:min(440px,100%)}
.printer{position:relative;z-index:2;height:44px;border-radius:14px;background:linear-gradient(#1a201b,#0c110d);border:1px solid var(--line2);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--mute);box-shadow:0 16px 30px -10px #000}
.printer .led{width:8px;height:8px;border-radius:50%;background:var(--kit);box-shadow:0 0 10px var(--kit);animation:blink .4s infinite}
.printer.idle .led{animation:none}
.printer::after{content:"";position:absolute;left:18px;right:18px;bottom:-3px;height:6px;border-radius:3px;background:#000}
.paper{overflow:hidden;margin:0 18px;padding-bottom:12px}
.pass{position:relative;background:var(--chalk);color:var(--ink);padding:22px 22px 18px;transform:translateY(-102%);filter:drop-shadow(0 20px 30px rgba(0,0,0,.5))}
.pass::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='10'><path d='M0 0h20L10 10z' fill='%23f3f1e8'/></svg>") repeat-x}
.pass.print{animation:print 2.2s steps(14) forwards}
@keyframes print{to{transform:none}}
.ps-top{display:flex;justify-content:space-between;align-items:center}
.ps-top b{font:900 30px/1 var(--display);letter-spacing:.04em;transform:skewX(-9deg)}
.ps-top span{color:rgba(5,8,6,.55)}
.ps-team{margin:14px -22px;padding:14px 22px;background:var(--ink);color:var(--kit);display:flex;align-items:center;gap:12px}
.ps-team i{width:22px;height:22px;border-radius:50%;background:var(--kit);flex:0 0 auto}
.ps-team b{font:900 38px/.95 var(--display);text-transform:uppercase;word-break:break-word}
.ps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.ps-grid small{display:block;font:600 9px var(--mono);letter-spacing:.12em;color:rgba(5,8,6,.5)}
.ps-grid b{font:800 22px/1.05 var(--display);text-transform:uppercase}
.ps-cap{margin-top:14px;padding-top:12px;border-top:1px dashed rgba(5,8,6,.3);color:rgba(5,8,6,.65)}
.ps-bar{margin-top:14px;height:54px}
.ps-bar svg{width:100%;height:100%}
.ps-id{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.ps-id b{font:700 18px var(--mono)}
.ps-stamp{position:absolute;right:20px;bottom:64px;font:900 18px/1 var(--display);text-transform:uppercase;color:var(--flare);border:2.5px solid var(--flare);border-radius:6px;padding:5px 8px;transform:rotate(-10deg);background:rgba(243,241,232,.85);opacity:0}
.pass.print .ps-stamp{animation:stamp .4s var(--spring) 2.3s forwards}
@keyframes stamp{from{opacity:0;transform:rotate(-10deg) scale(2.2)}to{opacity:1;transform:rotate(-10deg) scale(1)}}
.rc-act{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px;opacity:0;transform:translateY(10px);transition:.6s var(--out)}
.rc-act.on{opacity:1;transform:none}
.rc-act .btn{height:46px;font-size:14px}
.rc-act .wide{grid-column:1/-1}
.rc-note{grid-column:1/-1;text-align:center;color:var(--mute);font-size:13px;margin-top:4px;text-shadow:0 1px 8px #000}

.toast{position:fixed;left:50%;top:calc(var(--top) + 10px);z-index:70;transform:translate(-50%,-20px);opacity:0;background:var(--chalk);color:var(--ink);padding:10px 18px;border-radius:999px;font-weight:600;font-size:14px;transition:.4s var(--out);pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .rn .v{display:none} .live-t{display:none} }
@media (max-width:900px){
  :root{--top:58px;--tick:34px}
  .top{padding:0 14px;gap:10px}
  .logo{font-size:24px}
  .rail{position:fixed;top:var(--top);left:14px;right:14px;max-width:none;padding:0;height:22px}
  .rail-track{top:10px;left:8px;right:8px}
  .rn .l,.rn .v{display:none}
  .rn .d{margin-top:5px}
  .cur-l{display:block;margin-left:auto;color:var(--kit)}
  .top-r .chip:not(.icb){display:none}
  .gate{padding:0 18px 18px;justify-content:flex-end}
  .neon{font-size:clamp(84px,26vw,150px)}
  .greet{font-size:14px;min-height:4.4em}
  .g-row{flex-direction:column;gap:10px;margin-top:14px}
  .now{min-width:0;grid-template-columns:1fr 1fr;gap:8px 14px;padding:12px 14px}
  .now div b{font-size:21px}
  .desk{left:0;right:0;width:auto;top:auto;bottom:var(--tick);max-height:58svh;border-radius:24px 24px 0 0;border-bottom:0}
  .desk.hidden{transform:translateY(40px)}
  .desk-h{padding:12px 18px}
  .desk-b{padding:16px 18px 20px}
  .q{font-size:38px}
  .hint{margin:6px 0 12px}
  .dates{grid-template-columns:repeat(7,64px);overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
  .dt{scroll-snap-align:start}
  .sq{grid-template-columns:96px 1fr}.sq svg{width:96px;height:60px}.sq b{font-size:36px}
  .kit i{width:38px;height:38px}
  .ps-team b{font-size:30px}
  .ps-grid b{font-size:19px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-delay:0s!important;transition-duration:.001s!important}
}
</style>

<!-- STEPS 1-5: THE FRONT DESK -->

<script type="module">
/* =====================================================================
   CONFIG — placeholders. Edit hours / prices / contacts here; the whole
   site (desk, rates, ticker, 3D scoreboard) reads from this block.
   ===================================================================== */
const CONFIG = {
  name: "STRIKE",
  whatsapp: "8801927803277",       // owner's WhatsApp, international format, no "+"
  phone: "+880 1927-803277",
  currency: "৳",
  slotMinutes: 90,
  firstKickoff: "06:00",           // PLACEHOLDER opening time
  slotsPerDay: 12,                 // 06:00 → 24:00
  bookAheadDays: 14,
  advancePercent: 30,              // PLACEHOLDER
  weekendDays: [5, 6],             // Fri, Sat
  weekendSurcharge: 300,           // PLACEHOLDER
  tiers: [                         // PLACEHOLDER prices
    { id: "dawn",  name: "Dawn",  bn: "ভোর", from: "06:00", to: "09:00", price: 1500, color: "#7fd6ff" },
    { id: "day",   name: "Day",   bn: "দিন", from: "09:00", to: "16:30", price: 1800, color: "#f3f1e8" },
    { id: "prime", name: "Prime", bn: "রাত", from: "16:30", to: "24:00", price: 2800, color: "#d4ff3a" }
  ],
  squads: [5, 6, 7],
  demoOccupancy: 0.4,              // DEMO ONLY — fakes other teams' bookings until a backend exists. Set 0 at launch.
  lat: 22.80649767795758,
  lng: 89.52512328868221
};
const KITS = [
  { n: "Lime", c: "#d4ff3a" }, { n: "Flare", c: "#ff5a1f" }, { n: "Sky", c: "#5cc8ff" },
  { n: "Crimson", c: "#ff2d4a" }, { n: "Royal", c: "#5b6cff" }, { n: "Chalk", c: "#f3f1e8" }
];
const TEAM_IDEAS = ["Rupsha Rovers", "Sundarbans Tigers", "Bhairab Blasters", "Golpata United", "Shibbari Strikers", "Sonadanga FC", "Khan Jahan XI", "Daulatpur Dynamos", "Boyra Bulls", "Gollamari Galaxy", "Mongla Mariners", "Royal Bengal FC"];

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const pad = n => String(n).padStart(2, "0");
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const toMin = s => { const [h, m] = s.split(":").map(Number); return h * 60 + m; };
const fmt24 = m => `${pad(Math.floor(m / 60) % 24)}:${pad(m % 60)}`;
const fmt12 = m => { const h = Math.floor(m / 60) % 24; return `${(h % 12) || 12}:${pad(m % 60)} ${h < 12 ? "AM" : "PM"}`; };
const money = n => CONFIG.currency + n.toLocaleString("en-IN");
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const isMobile = () => innerWidth <= 900;
const DOW = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

/* Khulna is UTC+6 all year — everything runs on Khulna time, whatever the visitor's clock says. */
const KHL = 360;
const khl = () => new Date(Date.now() + KHL * 60000);
const nowMin = () => { const d = khl(); return d.getUTCHours() * 60 + d.getUTCMinutes() + d.getUTCSeconds() / 60; };

/* ---------- model ---------- */
const tierFor = ko => CONFIG.tiers.find(t => ko >= toMin(t.from) && ko < toMin(t.to)) || CONFIG.tiers.at(-1);
const SLOTS = Array.from({ length: CONFIG.slotsPerDay }, (_, i) => {
  const ko = toMin(CONFIG.firstKickoff) + i * CONFIG.slotMinutes;
  return { i, ko, ft: ko + CONFIG.slotMinutes, tier: tierFor(ko) };
});
const OPEN = SLOTS[0].ko, CLOSE = SLOTS.at(-1).ft;
function buildDays() {
  const n = khl();
  return Array.from({ length: CONFIG.bookAheadDays }, (_, i) => {
    const dt = new Date(Date.UTC(n.getUTCFullYear(), n.getUTCMonth(), n.getUTCDate() + i));
    return { i, key: dt.toISOString().slice(0, 10), d: dt.getUTCDate(), m: dt.getUTCMonth(), dow: dt.getUTCDay() };
  });
}
let DAYS = buildDays();
const isWeekend = d => CONFIG.weekendDays.includes(d.dow);
const priceFor = (d, s) => s.tier.price + (isWeekend(d) ? CONFIG.weekendSurcharge : 0);
const cap = s => s[0] + s.slice(1).toLowerCase();
const dayName = d => d.i === 0 ? "Today" : d.i === 1 ? "Tomorrow" : `${cap(DOW[d.dow])} ${d.d} ${cap(MON[d.m])}`;
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; }
function demoTaken(d, s) {
  const w = { dawn: .55, day: .7, prime: 1.5 }[s.tier.id] ?? 1;
  return hash(d.key + "#" + s.i) < CONFIG.demoOccupancy * w * (1.35 - d.i * .06) * (isWeekend(d) ? 1.25 : 1);
}
let bookings = store.get("strike-bookings", []);
function statusOf(d, s) {
  const mine = bookings.find(b => b.day === d.key && b.slot === s.i);
  if (d.i === 0) {
    const n = nowMin();
    if (n >= s.ft) return { s: "past", label: "Full time" };
    if (n >= s.ko) { const t = mine || demoTaken(d, s); return { s: "live", label: t ? `In play ${Math.min(90, Math.floor(n - s.ko) + 1)}'` : "Kicked off", taken: !!t, min: Math.min(90, Math.floor(n - s.ko) + 1) }; }
  }
  if (mine) return { s: "mine", label: "Yours" };
  if (demoTaken(d, s)) return { s: "taken", label: "Booked" };
  return { s: "open", label: "Open" };
}
const openCount = d => SLOTS.filter(s => statusOf(d, s).s === "open").length;
function findNext() { for (const d of DAYS) for (const s of SLOTS) if (statusOf(d, s).s === "open") return { d, s }; return null; }
function liveNow() {
  const m = nowMin(), today = DAYS[0];
  const open = m >= OPEN && m < CLOSE;
  const slot = SLOTS.find(s => m >= s.ko && m < s.ft);
  const st = slot ? statusOf(today, slot) : null;
  return { m, open, slot, inPlay: !!(st && st.taken), minute: st?.min ?? 0, next: findNext(), left: openCount(today) };
}
function upcomingMine() {
  const n = nowMin(), todayKey = DAYS[0].key;
  return bookings.filter(b => b.day > todayKey || (b.day === todayKey && SLOTS[b.slot].ft > n)).sort((a, b) => (a.day + pad(a.slot)).localeCompare(b.day + pad(b.slot)))[0] || null;
}

/* ---------- live weather (Open-Meteo, no key) ---------- */
let WX = null;
async function loadWeather() {
  try {
    const u = `https://api.open-meteo.com/v1/forecast?latitude=${CONFIG.lat}&longitude=${CONFIG.lng}&current=temperature_2m,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&daily=weather_code,temperature_2m_max,precipitation_probability_max&timezone=Asia%2FDhaka&forecast_days=16`;
    const r = await fetch(u); if (!r.ok) throw 0;
    WX = await r.json();
  } catch { /* keep last */ }
}
function wxInfo(code, prob = null) {
  const o = { kind: "sun", label: "Clear", rain: 0, cloud: 0, storm: 0, fog: 0, code };
  if (code == null) return { ...o, kind: "na", label: "—" };
  if (code === 1) Object.assign(o, { kind: "partly", label: "Mostly clear", cloud: .2 });
  else if (code === 2) Object.assign(o, { kind: "partly", label: "Partly cloudy", cloud: .45 });
  else if (code === 3) Object.assign(o, { kind: "cloud", label: "Overcast", cloud: .8 });
  else if (code === 45 || code === 48) Object.assign(o, { kind: "fog", label: "Fog", cloud: .6, fog: 1 });
  else if (code >= 51 && code <= 57) Object.assign(o, { kind: "rain", label: "Drizzle", cloud: .7, rain: .35 });
  else if (code >= 61 && code <= 67) Object.assign(o, { kind: "rain", label: "Rain", cloud: .85, rain: .8 });
  else if (code >= 80 && code <= 82) Object.assign(o, { kind: "rain", label: "Showers", cloud: .75, rain: .7 });
  else if (code >= 95) Object.assign(o, { kind: "storm", label: "Thunderstorm", cloud: .95, rain: 1, storm: 1 });
  if (prob != null && o.rain > 0 && prob < 35) o.rain *= .3;
  return o;
}
const wxNow = () => WX?.current ? { ...wxInfo(WX.current.weather_code), temp: Math.round(WX.current.temperature_2m), wind: Math.round(WX.current.wind_speed_10m) } : null;
function wxAt(dayKey, minute) {
  if (!WX?.hourly) return null;
  const i = WX.hourly.time.indexOf(`${dayKey}T${pad(Math.floor(minute / 60) % 24)}:00`);
  if (i < 0) return null;
  const prob = WX.hourly.precipitation_probability[i];
  return { ...wxInfo(WX.hourly.weather_code[i], prob), temp: Math.round(WX.hourly.temperature_2m[i]), prob };
}
function wxDay(dayKey) {
  if (!WX?.daily) return null;

      if (gk && t > .74) { gk.tz = -2.1; gk.fast = true; gk.rollGoal = 1.25; }
      if (!SK.goal && t >= 1.22) {
        SK.goal = true; ripple = { t: 0 }; shake = .5; strobe = 1.8; kitPulse = 1; SK.cb.onGoal?.();
        P.forEach(p => { if (p.team === 0 && p.on) { p.party = true; p.fast = true; } });
      }
      if (SK.goal && t < 1.8) { const k = clamp((t - 1.22) / .55, 0, 1); ball.position.lerpVectors(SK.B1, SK.B2, k * k); ballGoal.copy(ball.position); }
      if (SK.goal && st) P.forEach(p => { if (p.party && p !== st) { p.tx = st.x - 1.2 + Math.sin(p.ph * 9) * 1.6; p.tz = st.z + Math.cos(p.ph * 9) * 1.6; } });
      [1.3, 1.5, 1.75, 2.05, 2.35, 2.7, 3.05, 3.45, 3.9, 4.4, 5, 5.6].forEach((at, i) => {
        if (t >= at && !SK.fired.has(i)) { SK.fired.add(i); const cols = [kitHex, "#d4ff3a", "#ffffff", kitHex, "#ff5a1f"]; launch(rnd(-14, 24), rnd(-17, -8) * (i % 3 === 0 ? -1 : 1), new Col(cols[i % cols.length])); }
      });
      if (!SK.orbit && t > 2.5) { SK.orbit = true; orbit = true; camSpeed = 1.1; }
      if (!SK.done && t >= 3.4) { SK.done = true; SK.cb.onDone?.(); }
      if (t > 7) SK = null;
    }

    // rockets & particles
    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i]; r.v.y -= 9 * dt; r.p.addScaledVector(r.v, dt); r.fuse -= dt;
      emit(r.p, new V3(rnd(-.4, .4), rnd(-1, 0), rnd(-.4, .4)), new Col(1.6, 1.2, .7), .4, .9);
      if (r.fuse <= 0) { burst(r.p, r.col); rockets.splice(i, 1); }
    }
    for (let i = 0; i < NP; i++) {
      if (pLife[i] <= 0) continue;
      pLife[i] -= dt; const o = i * 3;
      if (pLife[i] <= 0) { pPos[o + 1] = -999; pCol[o] = pCol[o + 1] = pCol[o + 2] = 0; continue; }
      pVel[o + 1] -= 4.2 * dt; const d = pDrag[i];
      pVel[o] *= d; pVel[o + 1] *= d; pVel[o + 2] *= d;
      pPos[o] += pVel[o] * dt; pPos[o + 1] += pVel[o + 1] * dt; pPos[o + 2] += pVel[o + 2] * dt;
      const f = Math.pow(pLife[i] / pMax[i], 1.4) * (Math.random() < .08 ? .3 : 1);
      pCol[o] = pBase[o] * f; pCol[o + 1] = pBase[o + 1] * f; pCol[o + 2] = pBase[o + 2] * f;
    }
    pGeo.attributes.position.needsUpdate = true; pGeo.attributes.color.needsUpdate = true;

    // net ripple
    if (ripple && backNet) {
      ripple.t += dt; const pos = backNet.geometry.attributes.position, arr = pos.array, t = ripple.t;
      for (let i = 0; i < arr.length; i += 3) {
        const d = Math.hypot(backBase[i] - 1.85, backBase[i + 1] - .55);
        arr[i + 2] = -Math.exp(-d * d / 1.1) * Math.sin(t * 16 - d * 5) * .55 * Math.exp(-t * 2.2) - Math.exp(-d * d / .6) * .35 * Math.exp(-t * .8);
      }
      pos.needsUpdate = true; if (t > 3) { ripple = null; for (let i = 0; i < arr.length; i++) arr[i] = backBase[i]; pos.needsUpdate = true; }
    }

    // players
    P.forEach(p => {
      p.s += ((p.on ? 1 : 0) - p.s) * Math.min(1, dt * 4);
      p.g.visible = p.s > .01; if (!p.g.visible) return;
      p.g.scale.setScalar(Math.max(.001, p.s));
      const dx = p.tx - p.x, dz = p.tz - p.z, dd = Math.hypot(dx, dz) || 1, max = p.fast ? 7.5 : 5, sp = Math.min(max, dd * 2.2), kk = Math.min(1, dt * 5);
      p.vx += (dx / dd * sp - p.vx) * kk; p.vz += (dz / dd * sp - p.vz) * kk;
      p.x += p.vx * dt; p.z += p.vz * dt;
      const speed = Math.hypot(p.vx, p.vz);
      const want = speed > .4 ? Math.atan2(-p.vz, p.vx) : Math.atan2(-(ball.position.z - p.z), ball.position.x - p.x);
      let dyaw = want - p.yaw; dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw)); p.yaw += dyaw * Math.min(1, dt * 7);
      p.ph += dt * (2 + speed * 2.4);
      const sw = Math.sin(p.ph) * Math.min(.95, speed * .2);
      p.pivots[0].rotation.z = sw; p.pivots[1].rotation.z = -sw;
      p.roll += (p.rollGoal - p.roll) * Math.min(1, dt * 6);
      const jump = p.party ? Math.abs(Math.sin(clock * 8 + p.ph)) * .55 : 0;
      p.body.position.y = 1.07 + Math.abs(Math.sin(p.ph)) * .05 * Math.min(1, speed / 3);
      p.g.position.set(p.x, jump + (p.roll > .3 ? -.25 * p.roll : 0), p.z); p.g.rotation.y = p.yaw; p.g.rotation.x = p.roll;
    });

    // ball (non-scripted)
    if (!SK && mode !== "live") ball.position.lerp(ballGoal, Math.min(1, dt * 3));
    else if (!SK && sim.t >= 1) ball.position.lerp(ballGoal, Math.min(1, dt * 10));
    const mv = tmpV.subVectors(ball.position, ballPrev); const dist = Math.hypot(mv.x, mv.z);
    if (dist > 1e-4) ball.rotateOnWorldAxis(axis.set(mv.z, 0, -mv.x).normalize(), dist / .21);
    ballPrev.copy(ball.position);
    ballBlob.position.set(ball.position.x, .03, ball.position.z);
    ball.material.emissive.set(kitHex); ball.material.emissiveIntensity = charge * 1.6;

    // LED scroll + flag
    ledTex.offset.x = (ledTex.offset.x + dt * .035) % 1;
    flagH += (flagGoal - flagH) * Math.min(1, dt * 1.6);
    if (flagQueue && Math.abs(flagH - flagGoal) < .08 && flagGoal < 2) { drawFlag(flagQueue.team, flagQueue.color); flagQueue = null; flagGoal = 8.2; }
    flag.position.y = flagH;
    const fa = flagG.attributes.position.array;
    for (let i = 0; i < fa.length; i += 3) { const x = flagBase[i]; fa[i + 2] = Math.sin(clock * 4.2 - x * 2.3) * .2 * (x / 2.6); fa[i + 1] = flagBase[i + 1] + Math.sin(clock * 3 - x * 1.5) * .05 * (x / 2.6); }
    flagG.attributes.position.needsUpdate = true; flagG.computeVertexNormals();

    // camera
    if (orbit) { orbitA += dt * .1; camGoal.p.set(Math.cos(orbitA) * 33, 14, Math.sin(orbitA) * 33 + 4); camGoal.t.set(4, 1, 0); }
    const kc = reduced ? 1 : 1 - Math.exp(-dt * camSpeed);
    cam.p.lerp(camGoal.p, kc); cam.t.lerp(camGoal.t, kc);
    mouse.x += (mouse.tx - mouse.x) * .04; mouse.y += (mouse.ty - mouse.y) * .04;
    camera.position.copy(cam.p); camera.position.x += Math.sin(clock * .23) * .35 + mouse.x * 1.6; camera.position.y += Math.sin(clock * .31) * .15 - mouse.y * .8;
    if (shake > 0 && !reduced) { camera.position.x += rnd(-1, 1) * shake * .5; camera.position.y += rnd(-1, 1) * shake * .4; shake = Math.max(0, shake - dt * 1.1); }
    camera.lookAt(cam.t);
    view.x += (viewGoal.x - view.x) * Math.min(1, dt * 4); view.y += (viewGoal.y - view.y) * Math.min(1, dt * 4);
    camera.fov = 42 - charge * 7;
    camera.setViewOffset(innerWidth, innerHeight, -view.x, view.y, innerWidth, innerHeight);

    composer.render(dt);
    requestAnimationFrame(frame);
  }

  drawTurf(null); drawFlag("STRIKE", "#d4ff3a");
  document.fonts?.ready.then(() => { drawNeon(); drawTurf(curLabel, curSub); drawFlag(flagState.team, flagState.color); ledKey = ""; sbKey = ""; });
  requestAnimationFrame(frame);

  return {
    setCam(id) { if (SK?.done) SK = null; orbit = false; camSpeed = id === "gate" ? 1.1 : 1.6; const c = CAMS[id]; camGoal.p.set(...c.p); camGoal.t.set(...c.t); },
    setView(x, y) { viewGoal.x = x; viewGoal.y = y; },
    setAtmos, setFlood, setPlayers,
    setKit(hex) { if (hex !== kitHex) { kitHex = hex; kitPulse = 1; if (mode !== "live") homeMat.color.set(hex); } },
    setTurf(label, sub) { if (label === curLabel && sub === curSub) return; curLabel = label; curSub = sub; drawTurf(label, sub); },
    setLED: drawLED, setBoard: drawBoard,
    setNeon(v) { neonGoal = v; },
    setCharge(v) { charge = v; },
    strike, raiseFlag,
    setFlag(team, color) { drawFlag(team, color); },
    onClunk(fn) { onClunk = fn; }
  };
}

    import("three/addons/postprocessing/UnrealBloomPass.js"), import("three/addons/postprocessing/OutputPass.js")
  ]);
  W = createWorld(THREE, { EffectComposer: ec.EffectComposer, RenderPass: rp.RenderPass, UnrealBloomPass: ub.UnrealBloomPass, OutputPass: op.OutputPass });
} catch (e) { console.warn("3D turf unavailable:", e); }
if (!W) document.body.classList.add("no-gl");
else {
  W.onClunk(() => Snd.play("clunk"));
  const mine = upcomingMine(); if (mine) W.setFlag(mine.team, mine.kit);
  setTimeout(() => W.setNeon(1), 500);
  applyWorld(); updateView();
  document.fonts?.ready.then(() => applyWorld());
}
clearTimeout(bootFallback);
setTimeout(() => $("#boot").classList.add("gone"), W ? 350 : 0);
</script>
</body>
</html>
